apiVersion: v1
kind: ConfigMap
metadata:
  name: ovc-keycloak-configmap
  namespace: ovc-infra
data:
  KC_BOOTSTRAP_ADMIN_USERNAME: admin
  KC_BOOTSTRAP_ADMIN_PASSWORD: admin
  # Postgres-backed so the realm (and any change made in the admin console
  # after import) survives a pod restart - Keycloak's embedded dev DB would
  # lose everything on restart.
  KC_DB: postgres
  KC_DB_URL: jdbc:postgresql://ovc-postgres-service:5432/keycloak
  KC_DB_USERNAME: ovc
  KC_DB_PASSWORD: PleaseChangeMe1
  KC_HEALTH_ENABLED: "true"
  # The issuer and browser-facing URLs are pinned to the Ingress host, whatever
  # hostname a request used; in-cluster calls (ovc-frontend's token exchange,
  # ovc-backend's JWKS) go to the Service and get back URLs on that address.
  KC_HOSTNAME: http://keycloak.openvcenter.local
  KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
  KC_HTTP_ENABLED: "true"
