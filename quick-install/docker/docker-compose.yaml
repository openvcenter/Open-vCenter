services:
  ovc-postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ovc
      POSTGRES_USER: ovc
      POSTGRES_PASSWORD: PleaseChangeMe1
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ovc"]
      interval: 10s
      timeout: 5s
      retries: 5

  ovc-rabbitmq:
    image: rabbitmq:4-management
    hostname: ovc-rabbitmq # stable Erlang node name across recreates
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ovc
      RABBITMQ_DEFAULT_PASS: PleaseChangeMe1
    ports: ["5672:5672", "15672:15672"]
    volumes: ["rabbitmq:/var/lib/rabbitmq"]

  ovc-valkey:
    image: valkey/valkey:8
    restart: unless-stopped
    command: ["--save", "60", "1"]
    ports: ["6379:6379"]
    volumes: ["valkey:/data"]

  # Renders the VM / host consoles. Only ovc-frontend's server talks to it
  # (GUACD_URL below), over this Compose network - the browser never does,
  # so no port is published.
  ovc-guacd:
    image: guacamole/guacd:1.6.0
    restart: unless-stopped

  # Postgres-backed, with the "ovc" realm auto-imported on first boot - no
  # manual realm/client creation, and it survives a container restart.
  ovc-keycloak:
    image: quay.io/keycloak/keycloak:latest
    command: ["start-dev", "--import-realm"]
    restart: unless-stopped
    ports: ["8080:8080"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://ovc-postgres:5432/keycloak
      KC_DB_USERNAME: ovc
      KC_DB_PASSWORD: PleaseChangeMe1
      KC_HEALTH_ENABLED: "true"
      # The issuer and browser-facing URLs are pinned to the public URL, whatever
      # hostname a request used; server-to-server calls (ovc-frontend's token
      # exchange, ovc-backend's JWKS) go to http://ovc-keycloak:8080 and get
      # back URLs on that same internal address.
      KC_HOSTNAME: ${OVC_KEYCLOAK_URL:?run ./setup.sh first}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      # Read by the ${OVC_PUBLIC_URL} placeholders in ovc-realm.json.
      OVC_PUBLIC_URL: ${OVC_PUBLIC_URL:?run ./setup.sh first}
    volumes:
      - ./keycloak/ovc-realm.json:/opt/keycloak/data/import/ovc-realm.json:ro
    depends_on:
      ovc-postgres: { condition: service_healthy }
    # /health/ready on the management port. The image has no curl, so bash's
    # /dev/tcp does the HTTP request.
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"UP"' <&3
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  ovc-backend:
    image: ghcr.io/openvcenter/ovc-backend:latest
    restart: unless-stopped
    depends_on:
      ovc-postgres: { condition: service_healthy }
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports: ["8000:8000"]
    volumes: ["agent-binaries:/app/uploads"]
    environment:
      OVC_DATABASE_URL: postgresql+asyncpg://ovc:PleaseChangeMe1@ovc-postgres:5432/ovc
      OVC_VALKEY_URL: redis://ovc-valkey:6379/0
      OVC_RABBITMQ_URL: amqp://ovc:PleaseChangeMe1@ovc-rabbitmq:5672/
      OVC_RABBITMQ_MGMT_URL: http://ovc-rabbitmq:15672
      OVC_CORS_ORIGINS: '["${OVC_PUBLIC_URL:?run ./setup.sh first}"]'
      # Hyper-V hosts reach RabbitMQ from OUTSIDE Docker (they're separate
      # Windows machines), so this uses the host setup.sh asked for.
      OVC_AGENT_RABBITMQ_URL: ${OVC_AGENT_RABBITMQ_URL:?run ./setup.sh first}
      OVC_AUTH_MODE: oidc
      OVC_OIDC_ISSUER: ${OVC_KEYCLOAK_URL}/realms/ovc
      OVC_OIDC_JWKS_URL: http://ovc-keycloak:8080/realms/ovc/protocol/openid-connect/certs
      OVC_OIDC_AUDIENCE: ovc-frontend
      OVC_OIDC_CLIENT_ID: ovc-frontend
      OVC_AGENT_STORAGE: local
      OVC_AGENT_STORAGE_DIR: /app/uploads/agent-binaries
      # Through nginx's /api/ rule below - what a Hyper-V host's agent uses
      # to download ovc-agent binaries. Required for the Setup Agent
      # one-liner to work at all with OVC_AGENT_STORAGE=local.
      OVC_PUBLIC_BASE_URL: ${OVC_PUBLIC_URL}
      OVC_PREFLIGHT: "true"
      OVC_PREFLIGHT_RUN_MIGRATIONS: "true"
      OVC_PREFLIGHT_MANAGE_RABBITMQ_USERS: "true"

  ovc-backend-worker:
    image: ghcr.io/openvcenter/ovc-backend:latest
    restart: unless-stopped
    depends_on: [ovc-backend]
    command: ["python", "-m", "app.worker"]
    environment:
      OVC_DATABASE_URL: postgresql+asyncpg://ovc:PleaseChangeMe1@ovc-postgres:5432/ovc
      OVC_VALKEY_URL: redis://ovc-valkey:6379/0
      OVC_RABBITMQ_URL: amqp://ovc:PleaseChangeMe1@ovc-rabbitmq:5672/
      OVC_RABBITMQ_MGMT_URL: http://ovc-rabbitmq:15672

  ovc-frontend:
    image: ghcr.io/openvcenter/ovc-frontend:latest
    restart: unless-stopped
    depends_on:
      ovc-backend: { condition: service_started }
      ovc-guacd: { condition: service_started }
      # Sign-in needs Keycloak's discovery document; starting after it is
      # ready avoids a first boot where login fails until a retry.
      ovc-keycloak: { condition: service_healthy }
    ports: ["3000:3000"] # direct/debug access only - see README
    environment:
      API_URL: http://ovc-backend:8000/api
      # guacd for the consoles. ovc-frontend serves the Guacamole tunnel
      # (/webrdp/tunnel) itself and connects to guacd server-to-server, over
      # the internal Compose network. host:port, default port 4822.
      GUACD_URL: ovc-guacd:4822
      VITE_OIDC_PROVIDER_NAME: Keycloak
      # OIDC_ISSUER is what the browser uses; OIDC_INTERNAL_URL is the same
      # issuer as this container reaches it (inside it, "localhost" is the
      # container itself).
      OIDC_ISSUER: ${OVC_KEYCLOAK_URL}/realms/ovc
      OIDC_INTERNAL_URL: http://ovc-keycloak:8080/realms/ovc
      OIDC_CLIENT_ID: ovc-frontend
      OIDC_CLIENT_SECRET: ovc-frontend-dev-secret
      # From .env, generated by setup.sh - a session-signing key, not a shared
      # default, so it isn't hardcoded here.
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?run ./setup.sh first}
      BETTER_AUTH_URL: ${OVC_PUBLIC_URL}/frontend-api/auth
      # VITE_API_URL is left unset on purpose - it defaults to the relative
      # /frontend-api/api, correct once nginx puts everything on one domain
      # (see nginx/nginx.conf).

  # The "ingress": single entrypoint on :80, so the browser, Keycloak's
  # redirect_uri and OVC_PUBLIC_BASE_URL all agree on one origin
  # (OVC_PUBLIC_URL) instead of juggling per-service ports.
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on: [ovc-frontend, ovc-backend]
    ports: ["80:80"]
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

volumes:
  pgdata:
  rabbitmq:
  valkey:
  agent-binaries:
