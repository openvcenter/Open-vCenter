worker_processes auto;

events {
  worker_connections 1024;
}

http {
  sendfile on;
  proxy_http_version 1.1;

  # Docker's embedded DNS. proxy_pass with a variable makes nginx re-resolve
  # the service names (valid=10s) instead of pinning the IPs it saw at start -
  # otherwise restarting or recreating ovc-frontend / ovc-backend leaves nginx
  # talking to a stale IP (504/502) until nginx itself restarts.
  resolver 127.0.0.11 valid=10s ipv6=off;

  server {
    listen 80;
    server_name _;

    set $ovc_backend http://ovc-backend:8000;
    set $ovc_frontend http://ovc-frontend:3000;

    # ovc-agent-hyperv binaries uploaded through the frontend's Agent
    # Management dialog can be tens of MB - nginx's 1m default is too small.
    client_max_body_size 200m;

    # Direct/debug access to the API (Swagger at /api/docs), and where a
    # Hyper-V host's agent downloads binaries from (OVC_PUBLIC_BASE_URL).
    # Bypasses the frontend's auth-token-injecting proxy - not what the
    # browser app itself calls. Must stay listed before the catch-all.
    location /api/ {
      proxy_pass $ovc_backend;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
      proxy_pass $ovc_frontend;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      # The VM Console tab's Guacamole tunnel (/webrdp/tunnel, served by
      # ovc-frontend's own server, which talks to guacd internally) is a
      # long-lived HTTP long-poll, not a quick request/response - buffering
      # it or cutting it off at nginx's default read timeout makes guacd
      # think the client vanished and drop the session.
      proxy_buffering off;
      proxy_read_timeout 90s;
      # better-auth runs in cookie mode: the login callback sets the session
      # and the provider tokens as cookies, several KB of Set-Cookie headers.
      # nginx's 4k default answers that with "upstream sent too big header"
      # and a 502 right after the Keycloak login.
      proxy_buffer_size 32k;
      proxy_buffers 8 32k;
      proxy_busy_buffers_size 64k;
    }
  }
}
